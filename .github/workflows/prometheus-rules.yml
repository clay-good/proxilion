name: prometheus-rules

# production-readiness.md PR-5 acceptance: `promtool check rules` must pass on
# the alerting rules. Runs on any change to the Prometheus ops files so a
# malformed rule / bad PromQL can't merge.

on:
  pull_request:
    paths:
      - "ops/prometheus/**"
      - ".github/workflows/prometheus-rules.yml"
  push:
    branches: [main]
    paths:
      - "ops/prometheus/**"
      - ".github/workflows/prometheus-rules.yml"

jobs:
  promtool-check:
    name: promtool check rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROM_VERSION: "2.53.1"
      ALERTMANAGER_VERSION: "0.27.0"
    steps:
      - uses: actions/checkout@v4

      - name: install promtool
        run: |
          set -euo pipefail
          url="https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/prom.tar.gz
          tar -xzf /tmp/prom.tar.gz -C /tmp
          sudo install "/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version

      - name: check rules
        run: promtool check rules ops/prometheus/alerts.yml

      - name: check config
        # Validates prometheus.yml (incl. that it references alerts.yml).
        run: promtool check config ops/prometheus/prometheus.yml

      - name: install amtool
        run: |
          set -euo pipefail
          url="https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/am.tar.gz
          tar -xzf /tmp/am.tar.gz -C /tmp
          sudo install "/tmp/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool" /usr/local/bin/amtool
          amtool --version

      - name: check alertmanager config
        run: amtool check-config ops/prometheus/alertmanager.yml

      - name: check alert routing
        # The routing tree is the half of PR-5 that decides who wakes up.
        # Assert the three lanes resolve to the receivers slos.md documents,
        # so a well-formed but mis-wired route can't merge.
        run: |
          set -euo pipefail
          route() {
            amtool config routes test \
              --config.file=ops/prometheus/alertmanager.yml "$@"
          }
          expect() {
            want="$1"; shift
            got="$(route "$@")"
            [ "$got" = "$want" ] || {
              echo "routing drift: $* -> $got (expected $want)" >&2
              exit 1
            }
            echo "ok: $* -> $got"
          }
          expect proxilion-page     'severity="page"'   'alertname="ProxilionTrustPlaneDown"'
          expect proxilion-ticket   'severity="ticket"' 'alertname="ProxilionEdgeLoadShedding"'
          expect proxilion-security 'severity="page"'   'alertname="ProxilionPcaVerifyFailure"'
          expect proxilion-security 'severity="page"'   'alertname="ProxilionPicInvariantViolation"'
          expect proxilion-ticket   'alertname="SomethingUnlabelled"' 
