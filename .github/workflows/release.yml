name: release

# Tagged-release binary builds for `proxilion-cli`. Triggered on
# `v*.*.*` tag push. Builds the operator CLI for the four targets we
# expect operators to run on (Linux + macOS, x86_64 + aarch64), packs
# each into a `.tar.gz` with the LICENSE + README + CHANGELOG, computes
# sha256 checksums, and attaches everything to a GitHub Release.
#
# The proxy binary itself is deliberately *not* shipped here — it's
# the kind of thing operators install via Docker (we ship the
# Dockerfile + Helm chart) rather than as a raw binary. The CLI is
# the local-laptop / CI-runner / on-call-laptop tool that benefits
# from a one-line install.
#
# To cut a release:
#
#   git tag -a v0.1.0 -m "v0.1.0 — first public release"
#   git push origin v0.1.0
#
# The workflow creates the GitHub Release and uploads the artifacts.
# It does NOT publish to crates.io (we're not yet at that maturity);
# add a `cargo publish` step here when the workspace is ready.

on:
  push:
    tags:
      - "v*.*.*"
  # Manual trigger so a release can be re-run after a fix without
  # re-tagging (re-runs are idempotent — `upload-rust-binary-action`
  # replaces existing files on the same release).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist; e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  # `softprops/action-gh-release` (used transitively by
  # `upload-rust-binary-action`) needs `contents: write` to create
  # the release and upload assets.
  contents: write
  # SLSA build provenance via `actions/attest-build-provenance` (PR-10):
  # keyless Sigstore signing bound to this workflow's OIDC identity.
  id-token: write
  attestations: write

jobs:
  build-and-upload:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # One arch failure doesn't cancel the others — operators on a
      # working arch can still ship.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Use the tag's commit, not the workflow_dispatch runner's
          # default branch HEAD. For tag triggers this is implicit;
          # for workflow_dispatch, `inputs.tag` is the ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: install rust toolchain
        run: |
          rustup toolchain install stable --no-self-update
          rustup target add ${{ matrix.target }}
          rustup default stable

      # taiki-e/upload-rust-binary-action handles: cross-compile via
      # `cross` when needed (aarch64-unknown-linux-gnu on x86_64
      # runner), strip, archive into `.tar.gz`, compute sha256, and
      # upload to the GitHub Release. Pinned to a tagged release so a
      # silent action bump can't change the artifact shape.
      - name: build + upload proxilion-cli
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: proxilion-cli
          target: ${{ matrix.target }}
          # Archive contents: the binary, the LICENSE for redistribution,
          # the README so a one-step download includes the quickstart,
          # the CHANGELOG so a downloader knows what changed since the
          # last cut.
          include: LICENSE,README.md,CHANGELOG.md
          # GitHub will set the release name to the tag (e.g. `v0.1.0`)
          # and auto-generate release notes from PRs since the last tag;
          # we keep that default rather than re-render from CHANGELOG.md.
          checksum: sha256
          # Build with --locked so the release reproduces from
          # Cargo.lock exactly. Same posture as ci.yml/build-release.
          features: ""
          tar: all
          zip: none
          token: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance for the freshly-built binary (PR-10). Produces a
      # signed, verifiable attestation bound to this workflow's OIDC identity;
      # operators verify with `gh attestation verify <binary> --repo
      # clay-good/proxilion`. The binary lives at the cargo target path the
      # upload action just built.
      - name: attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/${{ matrix.target }}/release/proxilion-cli

  # ── SBOM + signatures (production-readiness.md PR-10) ──────────────────
  #
  # Runs after every arch has uploaded, because the signing step signs the
  # archives that are already on the Release.
  sbom-and-sign:
    name: sbom + cosign
    needs: build-and-upload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Keyless signing: the OIDC token IS the identity. No key material.
      id-token: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: install rust toolchain
        run: rustup toolchain install stable --no-self-update && rustup default stable

      - name: install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      # One SBOM per workspace member. `cargo cyclonedx` writes one file into
      # each member's directory per invocation, so this is a single pass.
      #
      # The dependency set comes from Cargo.lock, so it is the same across our
      # four unix targets modulo platform-conditional crates: the SBOM
      # describes the source graph the release was built from, which is what an
      # operator needs to answer "am I affected by CVE-X".
      - name: generate CycloneDX SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          cargo cyclonedx --format json --spec-version 1.5 --override-filename sbom
          for f in crates/*/sbom.json; do
            pkg="$(jq -r '.metadata.component.name' "$f")"
            mv "$f" "sbom/${pkg}-${TAG}.cdx.json"
          done
          ls -lh sbom/

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: download release archives
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern '*.tar.gz'
          ls -lh dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `--bundle` puts the signature, the Fulcio certificate and the Rekor
      # inclusion proof in ONE file, so verification is a single
      # `cosign verify-blob --bundle` rather than three flags and three
      # downloads.
      - name: cosign sign archives and SBOMs
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz sbom/*.cdx.json; do
            cosign sign-blob --yes "$f" --bundle "$f.cosign.bundle"
          done
          ls -lh dist/ sbom/

      - name: upload SBOMs + signatures to the release
        run: |
          set -euo pipefail
          gh release upload "$TAG" --clobber \
            sbom/*.cdx.json sbom/*.cosign.bundle dist/*.cosign.bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
