[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/proxy",
    "crates/policy-engine",
    "crates/shared-types",
]

[workspace.package]
edition = "2024"
# The dependency tree's real floor, not an aspiration. `time`, `home`,
# `async-nats` and `jsonwebtoken` all declare `rust-version = "1.88"`, so the
# workspace has not resolved on 1.85–1.87 for a while; declaring 1.85 only
# bought a confusing resolver error instead of a clear "requires rustc 1.88".
# Keeping it honest also lets clippy enable its MSRV-gated lints (let-chains
# and `is_multiple_of` both landed by 1.88), which is what surfaced the
# collapsible_if / manual_is_multiple_of cleanups in this commit.
rust-version = "1.88"
license = "MIT"
authors = ["Proxilion contributors"]
repository = "https://github.com/clay-good/proxilion"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "util", "timeout"] }
http = "1"
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
ciborium = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json"] }
regex = "1"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-pemfile = "2"

# Single upstream PIC dependency. `provenance-core` is a self-contained
# implementation (its own COSE/CBOR/Ed25519 stack) — it does NOT pull
# `pic-protocol/pic-rust` transitively. We previously also depended on
# `pic-protocol` and `provenance-bridge`; neither is used by our code, so
# they're gone.
#
# Pinned to a specific SHA so `cargo update` cannot silently bump us to an
# upstream commit that hasn't been reviewed. To deliberately bump, replace
# the rev below in a single PR (this is the only line that lets upstream
# Rust code into our build).
provenance-core = { git = "https://github.com/clay-good/provenance", rev = "400c83510cbb4c14f263e31292691f262baf265c" }

# COSE + crypto direct deps (mostly transitive but explicit for clarity)
coset = "0.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Policy / Rego
regorus = "0.5"

# OAuth / crypto / encoding
# JWT/OIDC id_token verification for in-process federation (PR-1). We verify
# with server-side-pinned algorithms rather than reusing the upstream
# `provenance-bridge` handler (which selects the algorithm from the token
# header — see oauth/idp_verify.rs), so our major need not track upstream's.
# jsonwebtoken 10 made the crypto backend pluggable and ships NO provider in
# its default features — without one, every `encode`/`decode` panics at
# runtime ("Could not automatically determine the process-level
# CryptoProvider"). We select `aws_lc_rs` to match the `rustls` backend this
# workspace already builds, so the process has exactly one crypto stack. The
# alternative, `rust_crypto`, would route RS* signature verification through
# the pure-Rust `rsa` crate (RUSTSEC-2023-0071, Marvin timing side channel).
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
# Scrub decoded secret key material from memory on drop (PR-3 memory hygiene).
# Already in the tree transitively (aes-gcm/ed25519-dalek); pinned direct so
# the HMAC-secret newtypes can wrap their bytes in `Zeroizing`.
zeroize = "1"
aes-gcm = { version = "0.10", features = ["aes"] }
sha2 = "0.10"
base32 = "0.5"
base64 = "0.22"
data-encoding = "2"
rand = "0.8"
subtle = "2"
url = "2"
percent-encoding = "2"
clap = { version = "4", features = ["derive"] }
moka = { version = "0.12", features = ["future"] }
metrics = "0.24"
# 0.17 pulls in metrics-util 0.20, which fixes a `get_or_create_counter`
# non-idempotence bug — 0.16 + metrics-util 0.19 created a fresh counter
# on EVERY `metrics::counter!()` call, so increments stopped accumulating
# past 1 once the macro-style call sites started getting re-evaluated.
# Reproduced + diagnosed locally; counters work cleanly on 0.17.
metrics-exporter-prometheus = { version = "0.17", default-features = false }
async-trait = "0.1"
bytes = "1"
mime = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
async-stream = "0.3"
mailparse = "0.15"

# Action-stream sinks (M3 §3.1 / §3.3).
async-nats = "0.48"
hmac = "0.12"
arc-swap = "1"
serde_urlencoded = "0.7"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "rustls-platform-verifier", "builder", "tokio1"] }

[profile.release]
lto = "thin"
codegen-units = 1
